plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

dependencies {
    testImplementation 'io.temporal:temporal-testing:1.39.0'
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.19'
}

test {
    useJUnitPlatform()
    // The SDK logs a warning for every failed activity attempt; the repro produces thousands.
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'error'
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
        showStandardStreams true
    }
}
